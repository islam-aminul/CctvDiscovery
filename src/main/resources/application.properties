# CCTV Discovery - default settings.
# Users override these in Settings; overrides are stored in
# %APPDATA%\CctvDiscovery\user-settings.properties.

# Application info
app.name=CCTV Discovery Tool
app.version=@project.version@
app.organization=Consultancy Services Ltd.

# --- Discovery -------------------------------------------------------------
# Multicast ONVIF WS-Discovery on every local interface
discovery.wsdiscovery.enabled=true
# WS-Discovery listen window and ONVIF request timeout (ms)
discovery.onvif.timeout=3000
# HTTP ports probed for an ONVIF device service (confirmed by a SOAP reply)
discovery.http.ports=80,81,88,443,2020,8000,8080,8081,8443,8899
# Ports probed for RTSP servers (confirmed by an RTSP reply, not by number)
discovery.rtsp.ports=554,5543,8554,10554,7447
# Vendor SDK / management ports, recorded to help identify devices
discovery.other.ports=37777,34567
# Refuse scans larger than this many addresses
discovery.max.targets=65536

# --- Concurrency -------------------------------------------------------------
# Simultaneous TCP connection attempts during the port scan
threads.port.scan.concurrency=256
# Devices identified/analysed in parallel
threads.devices.parallel=8
# Streams analysed in parallel (FFmpeg decoding is CPU heavy)
threads.stream.analysis.max=4

# --- Timeouts (ms) -----------------------------------------------------------
timeout.socket.connect=1000
timeout.socket.read=3000
# Hard limit for analysing one stream
timeout.stream.analysis=25000

# --- Stream analysis ---------------------------------------------------------
# Seconds of video sampled to measure bitrate, frame rate and GOP
stream.analysis.duration=8

# --- RTSP --------------------------------------------------------------------
rtsp.nvr.max.channels=64
rtsp.nvr.consecutive.failures=3
# Custom RTSP paths (semicolon-separated pairs: main;sub;main;sub)
rtsp.custom.paths=
# SDP_ONLY | RTP_PACKET | FRAME_CAPTURE
rtsp.validation.method=FRAME_CAPTURE
# 0 = default for the method
rtsp.validation.timeout=0

# --- Compliance rules --------------------------------------------------------
compliance.sub.min.height=360
compliance.sub.max.height=480
compliance.sub.max.kbps=512
compliance.flag.high.profile=true
# Maximum acceptable difference between camera and host clocks (seconds)
compliance.max.time.drift=5

# --- Export ------------------------------------------------------------------
export.default.directory=${user.home}/Documents
# Encrypt the workbook with a password chosen at export time
export.encrypt=true
# Include camera usernames/passwords (and credentialed RTSP URLs)
export.include.credentials=true

# --- MAC resolution ----------------------------------------------------------
mac.resolution.enabled=true

# --- UI ----------------------------------------------------------------------
ui.window.min.width=1100
ui.window.min.height=680
ui.credentials.max=8

# Light, Dark, or System to follow the operating system
ui.theme=SYSTEM
